<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brunda Marpadaga - Portfolio</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1CZkUchGCGcqMlCeX-e3vWjZid6kzWFPu">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-animation {
      text-align: center;
      margin: 60px 0;
    }

    .welcome-text {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeInUp 1s ease-out forwards;
    }

    .intro-text {
      font-size: 1.2rem;
      line-height: 1.8;
      max-width: 700px;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeInUp 1s ease-out 1s forwards;
    }

    .cta-buttons {
      opacity: 0;
      animation: fadeInUp 1s ease-out 2s forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .highlight {
      border-bottom: 2px solid #000;
      padding-bottom: 2px;
    }

    .projects-btn-wrap {
      position: relative;
      display: inline-block;
    }

    .deco-arrow,
    .deco-chip,
    .deco-sensor {
      position: absolute;
      pointer-events: none;
    }

    .deco-arrow {
      top: 50%;
      width: 44px;
      height: 26px;
    }

    .deco-arrow-left {
      left: -50px;
      animation: nudgeRight 1.6s ease-in-out infinite;
    }

    .deco-arrow-right {
      right: -50px;
      animation: nudgeLeft 1.6s ease-in-out infinite;
    }

    @keyframes nudgeRight {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50%      { transform: translateY(-50%) translateX(6px); }
    }

    @keyframes nudgeLeft {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50%      { transform: translateY(-50%) translateX(-6px); }
    }

    .deco-chip,
    .deco-sensor {
      top: -28px;
      width: 26px;
      height: 26px;
      filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.15));
    }

    .deco-chip {
      left: -4px;
      animation: floaty 3s ease-in-out infinite;
    }

    .deco-sensor {
      right: -4px;
      animation: floaty 3s ease-in-out infinite 0.6s reverse;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-5px) rotate(4deg); }
    }

    .story-btn {
      margin-left: 60px;
    }

    @media (max-width: 600px) {
      .deco-arrow,
      .deco-chip,
      .deco-sensor {
        display: none;
      }

      .story-btn {
        margin-left: 15px;
      }
    }
  </style>
</head>
<body>

  <header id="site-header"></header>
  <script src="assets/header.js"></script>

  <section id="home">
    <div class="welcome-animation">
      <div class="welcome-text">
        Hello, welcome to Brunda's portfolio!
      </div>
      
      <div class="intro-text">
        I'm a graduate of <span class="highlight">Portland State University</span> and I love 
        <span class="highlight">building things</span> - from bare metal firmware to embedded Linux systems. 
        Explore my portfolio to know more about me and my work.
      </div>

      <div class="cta-buttons">
        <span class="projects-btn-wrap">
          <svg class="deco-arrow deco-arrow-left" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 14 C 20 -6, 40 12, 48 12" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M38 4 L48 12 L38 20" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="deco-chip" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="14" height="14" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
            <line x1="9" y1="6" x2="9" y2="2" stroke="#000" stroke-width="1.6"/>
            <line x1="13" y1="6" x2="13" y2="2" stroke="#000" stroke-width="1.6"/>
            <line x1="17" y1="6" x2="17" y2="2" stroke="#000" stroke-width="1.6"/>
            <line x1="9" y1="20" x2="9" y2="24" stroke="#000" stroke-width="1.6"/>
            <line x1="13" y1="20" x2="13" y2="24" stroke="#000" stroke-width="1.6"/>
            <line x1="17" y1="20" x2="17" y2="24" stroke="#000" stroke-width="1.6"/>
          </svg>
          <a class="button" href="projects.html">View Projects</a>
          <svg class="deco-sensor" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
            <circle cx="13" cy="13" r="9" fill="#fff" stroke="#000" stroke-width="2"/>
            <circle cx="13" cy="13" r="3" fill="#000"/>
            <line x1="13" y1="1" x2="13" y2="4" stroke="#000" stroke-width="1.6"/>
            <line x1="13" y1="22" x2="13" y2="25" stroke="#000" stroke-width="1.6"/>
          </svg>
          <svg class="deco-arrow deco-arrow-right" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
            <path d="M58 14 C 40 -6, 20 12, 12 12" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 4 L12 12 L22 20" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <a class="button story-btn" href="about.html">My Story</a>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/footer.js"></script>
</body>
</html>
